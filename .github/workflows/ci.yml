name: CI

on:
  # Every branch, not just main: there are no pull requests here, so a branch
  # that only ran CI once it had landed would never be checked before it did.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS watches with FSEvents where Linux watches with inotify, and clippy
    # runs per OS because the code that picks between them is behind a cfg.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # mise install takes the Rust version from mise.toml, so CI cannot drift
      # from the development machines.
      - uses: jdx/mise-action@v4

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

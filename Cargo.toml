[package]
name = "boswell"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
humantime-serde = "1"
log = "0.4"
notify = "8"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# rustls with ring, because the release binary is built where cmake and perl are
# not available and both native-tls and aws-lc need them.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
